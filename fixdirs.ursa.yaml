# The base directory where your custom overlays live (optional).
# If provided, any relative 'src' paths in the 'overlays' section below 
# will be resolved relative to this path.
overlay_dir: /scratch4/NCEPDEV/marine/Alexander.Hrabski/FIX_highres_mom6_cic6


# ==============================================================================
# BASES
# src: Absolute path to the fix base directories on this specific system.
# dst: Relative to the <destination_directory> passed as a command-line argument.
# ==============================================================================
bases:
  OROG:
    src: /scratch3/NCEPDEV/global/role.glopara/fix/orog/20240917
    dst: FIXorog  # Creates <destination_directory>/FIXorog
  CPL:
    src: /scratch3/NCEPDEV/global/role.glopara/fix/cpl/20230526
    dst: FIXcpl   # Creates <destination_directory>/FIXcpl
  MOM:
    src: /scratch3/NCEPDEV/global/role.glopara/fix/mom6/20250128
    dst: FIXmom   # Creates <destination_directory>/FIXmom
  CICE:
    src: /scratch3/NCEPDEV/global/role.glopara/fix/cice/20240416
    dst: FIXcice  # Creates <destination_directory>/FIXcice


# ==============================================================================
# OVERLAYS
# src: Relative to 'overlay_dir' defined at the top (unless it starts with /).
#      Using a '.' means the source is the overlay_dir itself.
# dst: Relative to the <destination_directory> passed as a command-line argument.
# ==============================================================================
overlays:
  - name: OROG directory
    type: tree
    src: OROG
    dst: FIXorog

  - name: CPL directory
    type: tree
    src: CPL
    dst: FIXcpl

  - name: hgrid rename
    type: file
    src: MOM/regional.mom6.nc
    dst: FIXmom/008/regional.mom6.nc

  - name: MOM zgrid interpolant
    type: file
    src: MOM/interpolate_zgrid_30L.nc
    dst: FIXmom/008/interpolate_zgrid_30L.nc

  - name: oceanda zgrid interpolant
    type: file
    src: MOM/oceanda_zgrid_75L.nc
    dst: FIXmom/008/oceanda_zgrid_75L.nc
